name: Build and deploy to Azure Web App - docqa-abhilash

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Angular
        working-directory: doc-qa-app
        run: |
          npm ci
          npx ng build --configuration production

      - name: Copy Angular build into the API's wwwroot
        run: |
          mkdir -p DocQaApi/wwwroot
          cp -r doc-qa-app/dist/doc-qa-app/browser/. DocQaApi/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Run unit tests
        run: dotnet test DocQaApi.sln -c Release
        
      - name: Publish API
        run: dotnet publish DocQaApi/DocQaApi.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'docqa-abhilash'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app